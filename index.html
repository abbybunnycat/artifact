                                    className="w-full py-2 px-3 bg-amber-100 hover:bg-amber-200 border border-amber-300 text-amber-950 rounded-xl text-[11pt] font-bold transition-all shadow-sm flex items-center justify-center gap-1.5 mt-1"
                                  >
                                    🔍 觀看深度牌面寓意
                                  </button>
                                )}
                              </div>
                            ) : null}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {}
                  {/* AI 提示詞一鍵複製與匯出區 */}
                  <div className="bg-white/90 border border-amber-200 rounded-2xl p-6 shadow-md max-w-4xl mx-auto mt-12">
                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4 mb-4">
                      <div>
                        <h4 className="text-[15pt] font-bold text-amber-950 flex items-center gap-2">
                          <span>✨ 專屬 AI 靈魂心靈諮商提示詞</span>
                        </h4>
                        <p className="text-[11.5pt] text-stone-600 font-light mt-1">
                          包含完整的牌面象徵、深度寓意與大地指引。複製後可直接貼入 ChatGPT / Claude / Gemini 獲得深度諮商！
                        </p>
                      </div>
                      <button
                        onClick={handleCopyPrompt}
                        className="px-6 py-3 bg-gradient-to-r from-amber-600 to-amber-700 text-white font-bold rounded-full shadow hover:shadow-md transition-all text-[11.5pt] whitespace-nowrap"
                      >
                        📋 一鍵複製 AI 提示詞
                      </button>
                    </div>

                    <textarea
                      readOnly
                      value={generateAiPromptText()}
                      className="w-full h-36 p-3.5 bg-stone-50 border border-amber-200/80 rounded-xl text-stone-700 text-[10.5pt] font-mono leading-relaxed focus:outline-none resize-none"
                    />

                    <div className="mt-6 pt-4 border-t border-amber-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                      <span className="text-[11pt] text-stone-550">
                        💖 覺得指引有幫助？分享這份大天使的祝福給身邊的朋友：
                      </span>
                      <div className="flex gap-3">
                        <button
                          onClick={handleCopyShareText}
                          className="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 rounded-full text-[11pt] font-semibold transition-all"
                        >
                          🔗 複製社交貼文
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          ) : (
            /* 22 大天使牌義圖鑑視角 */
            <main className="max-w-6xl mx-auto px-4 mt-8 relative z-10 flex-grow">
              <div className="text-center max-w-3xl mx-auto mb-8">
                <h2 className="text-[22pt] font-light text-amber-950 tracking-widest mb-2">
                  22 大天使與雙生光聖義圖鑑
                </h2>
                <p className="text-[12pt] text-stone-600 font-light leading-relaxed">
                  探索大天使與神聖雙生光的靈魂象徵、能量寓意與日常生活實踐指引。點擊卡牌可閱讀完整深度聖義。
                </p>
              </div>

              {/* 搜尋與篩選列 */}
              <div className="bg-white/80 backdrop-blur border border-amber-200 rounded-2xl p-4 mb-8 max-w-3xl mx-auto shadow-sm flex flex-col sm:flex-row gap-4 items-center justify-between">
                <div className="relative w-full sm:w-2/3">
                  <input
                    type="text"
                    placeholder="搜尋大天使名字、關鍵字或牌義（如：保護、豐盛、寬恕）..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-4 py-2.5 bg-stone-50 border border-amber-200 rounded-xl text-[11.5pt] text-stone-800 focus:outline-none focus:border-amber-500"
                  />
                </div>

                <div className="flex gap-2 w-full sm:w-auto justify-center">
                  <button
                    onClick={() => setFilterType("all")}
                    className={`px-3.5 py-2 rounded-xl text-[11pt] font-semibold transition-all ${
                      filterType === 'all' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-900 border border-amber-200'
                    }`}
                  >
                    全部 (22)
                  </button>
                  <button
                    onClick={() => setFilterType("primary")}
                    className={`px-3.5 py-2 rounded-xl text-[11pt] font-semibold transition-all ${
                      filterType === 'primary' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-900 border border-amber-200'
                    }`}
                  >
                    主要大天使
                  </button>
                  <button
                    onClick={() => setFilterType("twin")}
                    className={`px-3.5 py-2 rounded-xl text-[11pt] font-semibold transition-all ${
                      filterType === 'twin' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-900 border border-amber-200'
                    }`}
                  >
                    雙生光大天使
                  </button>
                </div>
              </div>

              {/* 圖鑑網格 */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredGalleryCards.map((card) => (
                  <div
                    key={card.id}
                    onClick={() => setSelectedModalCard(card)}
                    className="bg-white/90 border border-amber-200/90 rounded-2xl p-5 shadow-sm hover:shadow-md transition-all cursor-pointer group flex flex-col justify-between hover:border-amber-400"
                  >
                    <div>
                      <div className="flex justify-between items-start mb-3">
                        <span className="text-[10pt] font-mono font-bold text-amber-700 bg-amber-100/80 px-2.5 py-0.5 rounded-full border border-amber-200">
                          #{card.id < 10 ? "0" + card.id : card.id} · {card.element}
                        </span>
                        <span className={`text-[9.5pt] px-2 py-0.5 rounded font-semibold ${
                          card.type === 'primary' ? 'bg-amber-900 text-amber-100' : 'bg-amber-800/80 text-amber-50'
                        }`}>
                          {card.type === 'primary' ? '主要大天使' : '雙生光大天使'}
                        </span>
                      </div>

                      <h3 className="text-[14pt] font-bold text-amber-950 group-hover:text-amber-700 transition-colors mb-1">
                        {card.name}
                      </h3>
                      <p className="text-[11pt] text-amber-850 font-medium mb-3">
                        {card.title}
                      </p>

                      <p className="text-[11pt] text-stone-600 line-clamp-3 font-light leading-relaxed mb-4">
                        {card.meaning}
                      </p>
                    </div>

                    <div className="pt-3 border-t border-amber-100 flex justify-between items-center text-[10.5pt] text-amber-900 font-bold">
                      <span>🏷️ {card.keyword}</span>
                      <span className="group-hover:translate-x-1 transition-transform">詳情 →</span>
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {}
          {/* 深度牌面寓意與靈魂檔案 Modal */}
          {selectedModalCard && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white border border-amber-300 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 sm:p-8 relative no-scrollbar">
                {/* 關閉按鈕 */}
                <button
                  onClick={() => setSelectedModalCard(null)}
                  className="absolute top-5 right-5 w-9 h-9 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center font-bold text-lg transition-all"
                >
                  ✕
                </button>

                <div className="flex items-center gap-3 mb-2">
                  <span className="text-[11pt] font-mono font-bold text-amber-800 bg-amber-100 px-3 py-1 rounded-full border border-amber-200">
                    #{selectedModalCard.id < 10 ? "0" + selectedModalCard.id : selectedModalCard.id} · {selectedModalCard.element}
                  </span>
                  <span className="text-[11pt] text-stone-500 font-light">
                    {selectedModalCard.type === 'primary' ? '大天使主頻率' : '神聖雙生光'}
                  </span>
                </div>

                <h3 className="text-[18pt] font-bold text-amber-950 mb-1">
                  {selectedModalCard.name}
                </h3>
                <h4 className="text-[12pt] font-semibold text-amber-800 mb-4">
                  {selectedModalCard.title}
                </h4>

                {/* 天使細語 */}
                <div className="bg-amber-50/80 border-l-4 border-amber-500 p-4 rounded-r-2xl mb-6">
                  <p className="text-[12pt] text-amber-950 font-medium italic leading-relaxed">
                    {selectedModalCard.message}
                  </p>
                </div>

                {/* 深度寓意解析三部曲 */}
                <div className="space-y-5 text-[11.5pt] leading-relaxed text-stone-700">
                  <div>
                    <h5 className="font-bold text-amber-950 text-[12.5pt] flex items-center gap-2 mb-1.5">
                      <span>🎨 牌面神聖象徵 (Symbolism)</span>
                    </h5>
                    <p className="bg-stone-50 p-3 rounded-xl border border-stone-200/80 text-stone-700">
                      {selectedModalCard.symbolism}
                    </p>
                  </div>

                  <div>
                    <h5 className="font-bold text-amber-950 text-[12.5pt] flex items-center gap-2 mb-1.5">
                      <span>🕊️ 深度靈性寓意 (Deep Meaning)</span>
                    </h5>
                    <p className="bg-stone-50 p-3.5 rounded-xl border border-stone-200/80 text-stone-700 leading-relaxed font-light">
                      {selectedModalCard.meaning}
                    </p>
                  </div>

                  <div>
                    <h5 className="font-bold text-amber-950 text-[12.5pt] flex items-center gap-2 mb-1.5">
                      <span>🌱 日常生活指引與實踐 (Action Step)</span>
                    </h5>
                    <p className="bg-amber-50/60 p-3.5 rounded-xl border border-amber-200/80 text-amber-950 font-medium">
                      {selectedModalCard.action}
                    </p>
                  </div>
                </div>

                <div className="mt-8 pt-4 border-t border-amber-100 flex justify-end">
                  <button
                    onClick={() => setSelectedModalCard(null)}
                    className="px-8 py-2.5 bg-amber-600 hover:bg-amber-700 text-white rounded-full font-bold transition-all shadow"
                  >
                    理解並接納啟示
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          <footer className="mt-16 text-center text-[11pt] text-stone-500 font-light border-t border-amber-200/40 py-6">
            <p>👼 願大天使的愛、光芒與和平，永遠守護您的靈魂旅程 🌿</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
